name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            analyzer/package-lock.json
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: npm ci --prefix analyzer
      - run: npm ci --prefix web
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=codelens --cov-report=term-missing
      - run: npm test --prefix web
      - run: npm run lint --prefix web
      - run: npm run format:check --prefix web
      - run: npm run build --prefix web
      - run: alembic upgrade head
      - run: alembic downgrade base
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/setup.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - name: Verify analyzer isolation
        run: |
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$(docker compose ps -q analyzer)")" = none
          docker compose exec -T analyzer python -c "import os; assert os.getuid() != 0; assert not os.getenv('CODELENS_ADMIN_TOKEN'); assert not os.getenv('CODELENS_GITHUB_PRIVATE_KEY_PATH')"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q analyzer)")" = true
          test "$(docker inspect -f '{{.HostConfig.Memory}}' "$(docker compose ps -q analyzer)")" -eq 536870912
          test "$(docker inspect -f '{{.HostConfig.NanoCpus}}' "$(docker compose ps -q analyzer)")" -eq 1000000000
          test "$(docker inspect -f '{{.HostConfig.PidsLimit}}' "$(docker compose ps -q analyzer)")" -eq 64
      - name: Run container sample through real adapters
        run: docker compose exec -T api python - < scripts/container_smoke.py
      - name: Verify restart and durable storage
        run: |
          docker compose stop api worker dispatcher analyzer db redis
          docker compose up -d --wait
          docker compose exec -T api python - --require-existing < scripts/container_smoke.py
      - name: Verify PostgreSQL backup and isolated restore
        run: |
          docker compose exec -T db pg_dump -U codelens -d codelens -Fc -f /tmp/codelens-validation.dump
          docker compose exec -T db createdb -U codelens codelens_restore_check
          docker compose exec -T db pg_restore -U codelens --no-owner --exit-on-error -d codelens_restore_check /tmp/codelens-validation.dump
          expected=$(docker compose exec -T db psql -U codelens -d codelens -Atc "SELECT count(*) FROM findings")
          restored=$(docker compose exec -T db psql -U codelens -d codelens_restore_check -Atc "SELECT count(*) FROM findings")
          test "$expected" -gt 0
          test "$expected" = "$restored"
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
