x-app: &app
  build: .
  env_file: .env
  environment:
    CODELENS_DATABASE_URL: postgresql+psycopg://codelens:codelens-local@db:5432/codelens
    CODELENS_REDIS_URL: redis://redis:6379/0
    CODELENS_ANALYZER_MODE: spool
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 128

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codelens
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: codelens-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U codelens"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    volumes:
      - analysis-spool:/analysis
    command: [rq, worker, --url, "redis://redis:6379/0", --serializer, rq.serializers.JSONSerializer, --with-scheduler, reviews]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  analyzer:
    build: .
    command: [python, -m, codelens.sandbox]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - analysis-spool:/analysis
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
  dispatcher:
    <<: *app
    command: [python, -m, codelens.jobs]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  analysis-spool:
