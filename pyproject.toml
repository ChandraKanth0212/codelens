[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens-review"
version = "0.1.0"
description = "Evidence-first, self-hosted pull request review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3", "PyJWT[crypto]>=2.10,<3",
  "PyYAML>=6.0.2,<7", "ruff==0.11.13", "redis>=6,<8", "rq>=2.6,<3", "detect-secrets==1.5.0"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=6,<7", "fakeredis[lua]>=2.31,<3"]

[tool.setuptools.packages.find]
include = ["codelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
